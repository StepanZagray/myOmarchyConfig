# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"
bindd = SUPER, M, Media widget, exec, qs -c desktop ipc call media toggle


# Unbind default Walker launcher (was: Launch apps)
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Omni menu, global, quickshell:palette-toggle

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
# Scrolling layout — comma/period scroll along the tape (replaces Omarchy Super+Comma = mako dismiss last)
# https://wiki.hypr.land/Configuring/Scrolling-Layout/#layout-messages
unbind = SUPER, COMMA
bindd = SUPER, COMMA, Scroll layout -1 column, layoutmsg, move -col
bindd = SUPER, PERIOD, Scroll layout +1 column, layoutmsg, move +col
bindd = SUPER SHIFT, PERIOD, Swap column left, layoutmsg, swapcol l

# Column width (scrolling layout); replaces Omarchy Super -/= (resizeactive for dwindle)
# https://wiki.hypr.land/Configuring/Scrolling-Layout/#layout-messages
unbind = SUPER, code:20
unbind = SUPER, code:21
bindd = SUPER, code:20, Column width -0.1, layoutmsg, colresize -0.1
bindd = SUPER, code:21, Column width +0.1, layoutmsg, colresize +0.1
bindd = SUPER ALT, code:20, Column width -0.5, layoutmsg, colresize -0.5
bindd = SUPER ALT, code:21, Column width +0.5, layoutmsg, colresize +0.5

# Screenshot: Super+Alt+P — free in Omarchy; avoids Super+Shift+S (overlaps Shift+workspace keys) and Super+S (scratchpad)
bindd = SUPER ALT, P, Screenshot to clipboard, exec, omarchy-capture-screenshot smart copy

# Drop Omarchy default: Super+Alt+S = move window to scratchpad (removes window from tiled layout)
unbind = SUPER ALT, S
bindd = SUPER ALT, S, Screen recording, exec, omarchy-cmd-screenrecord -cursor yes

# Quickshell
bindd = SUPER CTRL, R, Reload Quickshell, exec, sh -c 'pkill -x qs; pkill -x quickshell; sleep 0.2; qs -n -d -c desktop'

# Native Quickshell system menu; replaces Omarchy's inherited Walker menu on
# Super+Escape and the hardware power key while keeping the same actions.
unbind = SUPER, ESCAPE
unbind = , XF86PowerOff
bindd = SUPER, ESCAPE, System menu, exec, qs -c desktop ipc call power toggle
bindld = , XF86PowerOff, Power menu, exec, qs -c desktop ipc call power toggle

# Quickshell notification controls replacing the inherited Mako commands.
# Super+Comma remains the scrolling-layout binding defined above.
unbind = SUPER SHIFT, COMMA
unbind = SUPER CTRL, COMMA
unbind = SUPER ALT, COMMA
unbind = SUPER SHIFT ALT, COMMA
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, qs -c desktop ipc call notifications dismissAll
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, qs -c desktop ipc call notifications toggleSilent
bindd = SUPER ALT, COMMA, Invoke last notification, exec, qs -c desktop ipc call notifications invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, qs -c desktop ipc call notifications restore

# Volume / brightness OSD (Quickshell; overrides Omarchy media.conf swayosd bindings)
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = ALT, XF86AudioRaiseVolume
unbind = ALT, XF86AudioLowerVolume
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
unbind = SHIFT, XF86MonBrightnessUp
unbind = SHIFT, XF86MonBrightnessDown
unbind = ALT, XF86MonBrightnessUp
unbind = ALT, XF86MonBrightnessDown
unbind = , XF86KbdBrightnessUp
unbind = , XF86KbdBrightnessDown
unbind = , XF86KbdLightOnOff
unbind = , XF86TouchpadToggle
unbind = , XF86TouchpadOn
unbind = , XF86TouchpadOff
bindeld = , XF86AudioRaiseVolume, Volume up, exec, qs -c desktop ipc call osd volumeRaise
bindeld = , XF86AudioLowerVolume, Volume down, exec, qs -c desktop ipc call osd volumeLower
bindeld = , XF86AudioMute, Mute, exec, qs -c desktop ipc call osd volumeMute
bindeld = , XF86AudioMicMute, Mute microphone, exec, qs -c desktop ipc call osd micMuteToggle
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, qs -c desktop ipc call osd volumeUp1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, qs -c desktop ipc call osd volumeDown1
bindeld = , XF86MonBrightnessUp, Brightness up, exec, qs -c desktop ipc call osd brightnessUp5
bindeld = , XF86MonBrightnessDown, Brightness down, exec, qs -c desktop ipc call osd brightnessDown5
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, qs -c desktop ipc call osd brightnessMax
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, qs -c desktop ipc call osd brightnessMin
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, qs -c desktop ipc call osd brightnessUp1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, qs -c desktop ipc call osd brightnessDown1
bindeld = , XF86KbdBrightnessUp, Keyboard brightness up, exec, qs -c desktop ipc call osd kbdBrightnessUp
bindeld = , XF86KbdBrightnessDown, Keyboard brightness down, exec, qs -c desktop ipc call osd kbdBrightnessDown
bindld = , XF86KbdLightOnOff, Keyboard backlight cycle, exec, qs -c desktop ipc call osd kbdBrightnessCycle
bindld = , XF86TouchpadToggle, Toggle touchpad, exec, qs -c desktop ipc call osd touchpadToggle
bindld = , XF86TouchpadOn, Enable touchpad, exec, qs -c desktop ipc call osd touchpadOn
bindld = , XF86TouchpadOff, Disable touchpad, exec, qs -c desktop ipc call osd touchpadOff
