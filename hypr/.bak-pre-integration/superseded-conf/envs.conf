# Prefer Intel iGPU for compositor rendering and desktop apps.
# NVIDIA is used only when launched via `prime-run` (see bindings.conf).
# NOTE: AQ_DRM_DEVICES is colon-separated, so /dev/dri/by-path/pci-0000:00:02.0-card
# cannot be used here -- aquamarine splits it on the colons inside the PCI address.
# intel-card/nvidia-card are colon-free PCI-pinned aliases created by
# /etc/udev/rules.d/61-drm-gpu-alias.rules; they survive card0/card1 renumbering.
env = AQ_DRM_DEVICES,/dev/dri/intel-card:/dev/dri/nvidia-card

# Intel VA-API for video decode on the iGPU
env = LIBVA_DRIVER_NAME,iHD
